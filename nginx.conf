server {
  listen 80;
  server_name www.ki-buechhaltig.ch;
  return 301 https://ki-buechhaltig.ch$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
